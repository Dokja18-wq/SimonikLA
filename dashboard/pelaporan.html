  <body>
    <div class="app-layout">
      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="brand">
          <div class="brand-title"><i class="fas fa-chart-line text-blue-500 me-1"></i> SiMonik LA</div>

        </div>

          <a class="nav-link" href="dashboard_pemimpin.html">
            <i class="fas fa-tachometer-alt"></i> Dashboard
          </a>
          <a class="nav-link" href="login.php">
            <i class="fas fa-user-shield"></i> Admin OPD
          </a>
          <a class="nav-link active" href="pelaporan.html">
            <i class="fas fa-file-alt"></i> Pelaporan
          </a>
        </nav>
      </div>

      <!-- MAIN CONTENT -->
      <div class="main-content">
        <div class="header-title mb-4">
          <h2>Laporan Kinerja OPD</h2>
          <p>Daftar lengkap capaian dan target realisasi program kerja instansi pemerintah</p>
        </div>

        <!-- Toolbar / Filter Card -->
        <div class="filter-card">
          <div class="filter-group">
            <label class="filter-label">Pilih Tahun Kerja</label>
            <select id="tahun" class="form-select">
              <option value="2024">2024</option>
              <option value="2025" selected>2025</option>
              <option value="2026">2026</option>
            </select>
          </div>
          <button onclick="loadData()" class="btn-primary-custom">
            <i class="fas fa-arrows-rotate"></i> Tampilkan
          </button>
          <button onclick="printLaporan()" class="btn-secondary-custom">
            <i class="fas fa-print"></i> Cetak Laporan
          </button>
        </div>

        <!-- Area Cetak Laporan -->
        <div id="areaCetak">
          <div class="table-container">
            <table class="table table-hover align-middle" id="tabelLaporan">
              <thead>
                <tr>
                  <th style="width: 60px; text-align: center;">No</th>
                  <th style="width: 250px;">OPD</th>
                  <th>Nama Program Kerja</th>
                  <th style="width: 120px; text-align: right;">Target</th>
                  <th style="width: 120px; text-align: right;">Realisasi</th>
                  <th style="width: 100px; text-align: center;">Triwulan</th>
                </tr>
              </thead>
              <tbody id="tbodyLaporan"></tbody>
            </table>
          </div>
        </div>

        <footer>
          <div class="text-center text-muted">
            <i class="fas fa-circle-info me-1"></i> SiMonik LA • Sistem Monitoring Kinerja Pemerintah Kabupaten Lamongan
          </div>
        </footer>
      </div>
    </div>

    <script>
      async function loadData() {
        const tahun = document.getElementById("tahun").value;
        const tbody = document.getElementById("tbodyLaporan");
        
        // Loader state
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="fas fa-spinner fa-spin fa-lg me-2"></i> Memuat data...
            </td>
          </tr>
        `;

        try {
          const response = await fetch(
            `http://localhost:3000/api/kinerja?tahun=${tahun}`,
          );

          if (!response.ok) throw new Error("Gagal memuat data dari server");
          
          const data = await response.json();
          tbody.innerHTML = "";

          if (data.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" class="text-center py-5 text-muted">
                  Tidak ada data untuk tahun ${tahun}
                </td>
              </tr>
            `;
            return;
          }

          data.forEach((item, index) => {
            tbody.innerHTML += `
              <tr>
                <td class="text-center fw-medium text-secondary">${index + 1}</td>
                <td class="fw-semibold text-dark">${item.opd}</td>
                <td>${item.nama_program}</td>
                <td class="text-right font-monospace" style="text-align: right;">${item.target.toLocaleString('id-ID')}</td>
                <td class="text-right font-monospace" style="text-align: right;">${item.realisasi.toLocaleString('id-ID')}</td>
                <td class="text-center fw-medium text-secondary">${item.triwulan ? 'TW ' + item.triwulan : '-'}</td>
              </tr>
            `;
          });
        } catch (error) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center py-5 text-danger">
                <i class="fas fa-triangle-exclamation me-2"></i> Gagal mengambil data. Pastikan server backend Anda berjalan di http://localhost:3000
              </td>
            </tr>
          `;
          console.error("Fetch error:", error);
        }
      }

      function printLaporan() {
        window.print();
      }

      // Initial load
      document.addEventListener("DOMContentLoaded", () => {
        loadData();
      });
    </script>
